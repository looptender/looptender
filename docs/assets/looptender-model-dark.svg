<svg xmlns="http://www.w3.org/2000/svg" width="960" height="568" viewBox="0 0 960 568" role="img" aria-labelledby="t d">
  <title id="t">How looptender fits: you, a coordinator, and its lanes</title>
  <desc id="d">You, at the top, set goals and give approvals to a Coordinator session and receive holds when a person is needed. A supervision frame labelled looptender surrounds the coordinator: it wakes it, bounds it, recovers it, and holds for you when needed. Below the frame, the coordinator delegates to three Lane conversations, which sit outside supervision and are tracked by count and state.</desc>
  <defs>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.9" fill="#19202A"/>
    </pattern>
    <marker id="arr-fg-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#F5F7FA" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
    <marker id="arr-attn-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#F0B14C" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
    <marker id="arr-bus-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#5F6E82" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <!-- Canvas + subtle architectural dot grid -->
  <rect width="960" height="568" fill="#0D1014"/>
  <rect x="24" y="16" width="912" height="536" fill="url(#grid-dark)"/>

  <!-- Top-right architectural header block -->
  <text x="904" y="46" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.2" fill="#56C2F0">SUPERVISION MODEL</text>
  <text x="904" y="68" text-anchor="end" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">One supervised loop per project</text>
  <text x="904" y="88" text-anchor="end" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9AA4B2">Same machine · single binary · session stays where it lives</text>

  <!-- 01 · YOU card (centered directly above Coordinator at x=260) -->
  <g>
    <rect x="80" y="26" width="360" height="72" rx="4" fill="#151A21" stroke="#495668" stroke-width="1.2"/>
    <text x="100" y="47" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" letter-spacing="1.1" fill="#8592A3">01 · PERSON IN THE LOOP</text>
    <text x="100" y="71" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F5F7FA">You</text>
    <text x="146" y="70" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">Goals, approvals &amp; final say</text>
    <circle cx="412" cy="55" r="5.5" fill="none" stroke="#F5F7FA" stroke-width="1.4"/>
    <path d="M402 74 C402 67.5 406 65 412 65 C418 65 422 67.5 422 74" fill="none" stroke="#F5F7FA" stroke-width="1.4" stroke-linecap="square"/>
  </g>

  <!-- Bidirectional control stems between You (y=98) and Supervision Frame (y=154) -->
  <line x1="210" y1="98" x2="210" y2="150" stroke="#F5F7FA" stroke-width="1.4" marker-end="url(#arr-fg-dark)"/>
  <rect x="72" y="114" width="128" height="24" rx="2" fill="#1B222C" stroke="#2D3644" stroke-width="1"/>
  <text x="136" y="130" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#F5F7FA">goals &amp; approvals</text>

  <line x1="312" y1="154" x2="312" y2="102" stroke="#F0B14C" stroke-width="1.4" marker-end="url(#arr-attn-dark)"/>
  <rect x="322" y="114" width="126" height="24" rx="2" fill="#2E2312" stroke="#6A4F23" stroke-width="1"/>
  <rect x="334" y="121" width="2.6" height="10" fill="#F0B14C"/>
  <rect x="339" y="121" width="2.6" height="10" fill="#F0B14C"/>
  <text x="351" y="130" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#F0B14C">holds for you</text>

  <!-- 02 · SUPERVISED LOOP FRAME -->
  <g>
    <rect x="56" y="154" width="848" height="214" rx="4" fill="#0F1A22" stroke="#22546C" stroke-width="1.2"/>
    <rect x="57" y="155" width="846" height="34" rx="3" fill="#12232F"/>
    <path d="M56 190 H904" stroke="#22546C" stroke-width="1"/>
    <path d="M56 164 V154 H66 M894 154 H904 V164 M56 358 V368 H66 M894 368 H904 V358" fill="none" stroke="#56C2F0" stroke-width="1.6" stroke-linecap="square"/>

    <!-- Frame header: Brand B mark + looptender label -->
    <g transform="translate(70,162) scale(0.62)"><path d="M24.2 10.6 A10 10 0 1 0 26 16" fill="none" stroke="#F5F7FA" stroke-width="2.4" stroke-linecap="square"/><path d="M25.6 6.2 V11.2 H20.6" fill="none" stroke="#F5F7FA" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/><rect x="11" y="14.5" width="10" height="3" fill="#56C2F0"/></g>
    <text x="98" y="177" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="-0.3" fill="#F5F7FA">looptender</text>
    <text x="180" y="176" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" letter-spacing="0.9" fill="#56C2F0">· SUPERVISOR</text>
    <text x="886" y="176" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" letter-spacing="1.0" fill="#8592A3">02 · SUPERVISED LOOP</text>

    <!-- Coordinator card (left inside frame) -->
    <rect x="80" y="208" width="360" height="140" rx="4" fill="#151A21" stroke="#495668" stroke-width="1.2"/>
    <rect x="100" y="226" width="8" height="8" rx="1" fill="#56C2F0"/>
    <text x="116" y="234" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" letter-spacing="1.0" fill="#56C2F0">COORDINATOR SESSION</text>
    <text x="100" y="268" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#F5F7FA">Coordinator</text>
    <text x="100" y="292" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">Plans work, assigns lanes, and reviews results.</text>
    <rect x="100" y="310" width="106" height="22" rx="2" fill="#1B222C" stroke="#2D3644" stroke-width="1"/>
    <text x="153" y="325" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" fill="#9AA4B2">1 per project</text>
    <rect x="214" y="310" width="174" height="22" rx="2" fill="#1B222C" stroke="#2D3644" stroke-width="1"/>
    <text x="301" y="325" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" fill="#9AA4B2">works solo without lanes</text>

    <!-- Precision bridge from Coordinator to Check Cadence Rail -->
    <line x1="440" y1="278" x2="478" y2="278" stroke="#56C2F0" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="474" y="274" width="8" height="8" rx="1" fill="#0F1A22" stroke="#56C2F0" stroke-width="1.4"/>

    <!-- Check Cadence Rail (right inside frame — Brand B signature element) -->
    <line x1="504" y1="224" x2="504" y2="334" stroke="#22546C" stroke-width="1.2"/>

    <rect x="499.5" y="219.5" width="9" height="9" rx="1" fill="#56C2F0"/>
    <text x="522" y="228" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#F5F7FA">Wakes it</text>
    <text x="632" y="228" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">nudges an idle session</text>

    <rect x="499.5" y="255.5" width="9" height="9" rx="1" fill="#56C2F0"/>
    <text x="522" y="264" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#F5F7FA">Bounds it</text>
    <text x="632" y="264" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">send, time &amp; progress caps</text>

    <rect x="499.5" y="291.5" width="9" height="9" rx="1" fill="#56C2F0"/>
    <text x="522" y="300" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#F5F7FA">Recovers it</text>
    <text x="632" y="300" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">retries or moves to next route</text>

    <rect x="499" y="327" width="3.5" height="10" fill="#F0B14C"/>
    <rect x="505.5" y="327" width="3.5" height="10" fill="#F0B14C"/>
    <text x="522" y="336" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#F0B14C">Holds for you</text>
    <text x="632" y="336" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">stops &amp; asks when unclear</text>
  </g>

  <!-- Orthogonal delegation bus from Coordinator (x=260, y=348) to 3 Lanes (centers 188, 480, 772) -->
  <g fill="none" stroke="#5F6E82" stroke-width="1.4">
    <path d="M260 348 V398"/>
    <path d="M188 424 V402 Q188 398 192 398 H768 Q772 398 772 402 V424"/>
    <path d="M480 398 V424"/>
  </g>
  <line x1="188" y1="414" x2="188" y2="424" stroke="#5F6E82" stroke-width="1.4" marker-end="url(#arr-bus-dark)"/>
  <line x1="480" y1="414" x2="480" y2="424" stroke="#5F6E82" stroke-width="1.4" marker-end="url(#arr-bus-dark)"/>
  <line x1="772" y1="414" x2="772" y2="424" stroke="#5F6E82" stroke-width="1.4" marker-end="url(#arr-bus-dark)"/>

  <!-- Bus annotation -->
  <text x="904" y="389" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="0.8" fill="#8592A3">03 · DELEGATED LANES · OUTSIDE SUPERVISION · TRACKED BY COUNT &amp; STATE</text>

  <!-- 03 · THREE LANE CARDS -->
  <g>
    <rect x="56" y="428" width="264" height="72" rx="4" fill="#151A21" stroke="#252C36" stroke-width="1.2"/>
    <text x="76" y="449" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.0" fill="#8592A3">LANE 01</text>
    <circle cx="300" cy="445" r="3.5" fill="none" stroke="#5F6E82" stroke-width="1.3"/>
    <text x="76" y="473" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F5F7FA">Lane</text>
    <text x="76" y="490" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9AA4B2">Child conversation · own model</text>

    <rect x="348" y="428" width="264" height="72" rx="4" fill="#151A21" stroke="#252C36" stroke-width="1.2"/>
    <text x="368" y="449" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.0" fill="#8592A3">LANE 02</text>
    <circle cx="592" cy="445" r="3.5" fill="none" stroke="#5F6E82" stroke-width="1.3"/>
    <text x="368" y="473" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F5F7FA">Lane</text>
    <text x="368" y="490" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9AA4B2">Child conversation · own model</text>

    <rect x="640" y="428" width="264" height="72" rx="4" fill="#151A21" stroke="#252C36" stroke-width="1.2"/>
    <text x="660" y="449" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="1.0" fill="#8592A3">LANE 03</text>
    <circle cx="884" cy="445" r="3.5" fill="none" stroke="#5F6E82" stroke-width="1.3"/>
    <text x="660" y="473" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F5F7FA">Lane</text>
    <text x="660" y="490" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9AA4B2">Child conversation · own model</text>
  </g>

  <!-- Footer hairline & caption -->
  <line x1="56" y1="522" x2="904" y2="522" stroke="#252C36" stroke-width="1"/>
  <text x="480" y="544" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9AA4B2">looptender supervises the coordinator. The coordinator runs its own lanes.</text>
</svg>
