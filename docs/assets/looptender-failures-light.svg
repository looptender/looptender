<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="t d">
  <title id="t">What looptender does when something goes wrong</title>
  <desc id="d">A cadence table with one row per case. Limit reached: moves to the next route you configured, or waits for the reset. Connection lost: waits for a later check; existing holds still apply. Turn failed: retries or re-prompts, within a cap. No progress: nudges within a cap, then holds. Needs a person: holds and shows it in status and the panel.</desc>
  <rect width="960" height="464" fill="#FFFFFF"/>

  <rect x="44" y="24" width="872" height="382" rx="4" fill="#FFFFFF" stroke="#6D7B8C" stroke-width="1.2"/>
  <rect x="45" y="25" width="870" height="60" rx="3" fill="#F3F5F7"/>

  <g transform="translate(60,44) scale(0.65)"><path d="M24.2 10.6 A10 10 0 1 0 26 16" fill="none" stroke="#11151B" stroke-width="2.4" stroke-linecap="square"/><path d="M25.6 6.2 V11.2 H20.6" fill="none" stroke="#11151B" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/><rect x="11" y="14.5" width="10" height="3" fill="#0B658C"/></g>
  <text x="88" y="59" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.1" fill="#5D6979">WHEN THIS HAPPENS</text>
  <text x="236" y="59" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.1" fill="#5D6979">RESPONSE</text>
  <text x="384" y="59" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.1" fill="#5D6979">LOOPTENDER ACTION</text>

  <line x1="64.2" y1="118" x2="64.2" y2="374" stroke="#D3D9E2" stroke-width="1.2"/>



  <line x1="44" y1="86" x2="916" y2="86" stroke="#D3D9E2" stroke-width="1"/>
  <rect x="60" y="113.5" width="8.5" height="8.5" rx="1" fill="#0B658C"/>
  <text x="86" y="123" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#11151B">Limit reached</text>
  <rect x="236" y="106" width="128" height="24" rx="2" fill="#EAF6FC" stroke="#9DD4EE" stroke-width="1"/>
  <text x="300" y="121.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="0.5" fill="#0B658C">NEXT ROUTE / WAIT</text>
  <text x="384" y="122.5" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5564">Moves to the next configured route after a test request, or waits.</text>

  <line x1="44" y1="150" x2="916" y2="150" stroke="#D3D9E2" stroke-width="1"/>
  <rect x="60" y="177.5" width="8.5" height="8.5" rx="1" fill="#0B658C"/>
  <text x="86" y="187" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#11151B">Connection lost</text>
  <rect x="236" y="170" width="128" height="24" rx="2" fill="#EAF6FC" stroke="#9DD4EE" stroke-width="1"/>
  <text x="300" y="185.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="0.5" fill="#0B658C">WAIT</text>
  <text x="384" y="186.5" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5564">Checks reachability and waits offline; existing holds still apply.</text>

  <line x1="44" y1="214" x2="916" y2="214" stroke="#D3D9E2" stroke-width="1"/>
  <rect x="60" y="241.5" width="8.5" height="8.5" rx="1" fill="#0B658C"/>
  <text x="86" y="251" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#11151B">Turn failed</text>
  <rect x="236" y="234" width="128" height="24" rx="2" fill="#EAF6FC" stroke="#9DD4EE" stroke-width="1"/>
  <text x="300" y="249.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="0.5" fill="#0B658C">BOUNDED RETRY</text>
  <text x="384" y="250.5" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5564">Retries within a cap. Unclassified errors never change routes.</text>

  <line x1="44" y1="278" x2="916" y2="278" stroke="#D3D9E2" stroke-width="1"/>
  <rect x="60" y="305.5" width="8.5" height="8.5" rx="1" fill="#0B658C"/>
  <text x="86" y="315" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#11151B">No progress</text>
  <rect x="236" y="298" width="128" height="24" rx="2" fill="#EAF6FC" stroke="#9DD4EE" stroke-width="1"/>
  <text x="300" y="313.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="0.5" fill="#0B658C">NUDGE → HOLD</text>
  <text x="384" y="314.5" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5564">Nudges within a cap, then holds. Deadlines &amp; Git checks bound work.</text>
  <rect x="44" y="342" width="872" height="64" fill="#FDF3E3" fill-opacity="0.35"/>
  <line x1="44" y1="342" x2="916" y2="342" stroke="#D3D9E2" stroke-width="1"/>
  <rect x="59.5" y="369" width="3.2" height="10" fill="#8D4C00"/><rect x="65.3" y="369" width="3.2" height="10" fill="#8D4C00"/>
  <text x="86" y="379" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#8D4C00">Needs a person</text>
  <rect x="236" y="362" width="128" height="24" rx="2" fill="#FDF3E3" stroke="#E4BF82" stroke-width="1"/>
  <text x="300" y="377.5" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" letter-spacing="0.5" fill="#8D4C00">HOLD FOR YOU</text>
  <text x="384" y="378.5" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5564">Holds supervision and shows why in status and the panel.</text>

  <text x="480" y="440" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#4A5564">When the right move is not clear, looptender holds and asks you.</text>
</svg>
