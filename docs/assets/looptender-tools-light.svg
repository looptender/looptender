<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="t d">
  <title id="t">looptender runs beside your agent tools</title>
  <desc id="d">One machine, drawn as a clean instrument frame. Inside it, four groups of agent tools sit side by side, each keeping its own session: BB threads, headless Claude Code and Codex, standalone Cursor and Antigravity CLIs, and custom or sessionpipe agents. Below them, one looptender supervisor on the same machine connects to each session to watch, wake, bound, and hold.</desc>
  <defs>
    <marker id="arr-acc-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#0B658C" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <rect width="960" height="456" fill="#FFFFFF"/>

  <rect x="34" y="24" width="892" height="370" rx="4" fill="#F3F5F7" stroke="#6D7B8C" stroke-width="1.2"/>
  <path d="M34 34 V24 H44 M916 24 H926 V34 M34 384 V394 H44 M916 394 H926 V384" fill="none" stroke="#0B658C" stroke-width="1.6" stroke-linecap="square"/>
  <text x="58" y="54" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.2" fill="#5D6979">YOUR MACHINE · LOCAL SUPERVISION</text>
  <text x="902" y="54" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.0" fill="#5D6979">NO HOSTED SERVICE · NO IDE ATTACHMENT</text>


  <rect x="58" y="84" width="196" height="126" rx="4" fill="#FFFFFF" stroke="#D3D9E2" stroke-width="1.2"/>
  <text x="156" y="108" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" letter-spacing="0.9" fill="#5D6979">AGENT HOST</text>
  <text x="156" y="134" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#11151B">BB threads</text>
  <rect x="78" y="148" width="156" height="24" rx="2" fill="#F3F5F7" stroke="#D3D9E2" stroke-width="1"/>
  <text x="156" y="164" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#11151B">BB thread + lanes</text>
  <text x="156" y="194" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4A5564">lanes · turn retry · plugin</text>
  <rect x="274" y="84" width="196" height="126" rx="4" fill="#FFFFFF" stroke="#D3D9E2" stroke-width="1.2"/>
  <text x="372" y="108" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" letter-spacing="0.9" fill="#5D6979">HEADLESS CLI</text>
  <text x="372" y="134" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#11151B">Claude Code · Codex</text>
  <rect x="294" y="148" width="156" height="24" rx="2" fill="#F3F5F7" stroke="#D3D9E2" stroke-width="1"/>
  <text x="372" y="164" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#11151B">saved session ID</text>
  <text x="372" y="194" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4A5564">wakes · fallbacks · limits</text>
  <rect x="490" y="84" width="196" height="126" rx="4" fill="#FFFFFF" stroke="#D3D9E2" stroke-width="1.2"/>
  <text x="588" y="108" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" letter-spacing="0.9" fill="#5D6979">STANDALONE CLI</text>
  <text x="588" y="134" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#11151B">Cursor · Antigravity</text>
  <rect x="510" y="148" width="156" height="24" rx="2" fill="#F3F5F7" stroke="#D3D9E2" stroke-width="1"/>
  <text x="588" y="164" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#11151B">saved session ID</text>
  <text x="588" y="194" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4A5564">first route only</text>
  <rect x="706" y="84" width="196" height="126" rx="4" fill="#FFFFFF" stroke="#D3D9E2" stroke-width="1.2"/>
  <text x="804" y="108" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" letter-spacing="0.9" fill="#5D6979">CUSTOM &amp; OBSERVED</text>
  <text x="804" y="134" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#11151B">Defined · sessionpipe</text>
  <rect x="726" y="148" width="156" height="24" rx="2" fill="#F3F5F7" stroke="#D3D9E2" stroke-width="1"/>
  <text x="804" y="164" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" fill="#11151B">its own session</text>
  <text x="804" y="194" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#4A5564">status / resume · tier-0</text>

  <line x1="156" y1="248" x2="804" y2="248" stroke="#0B658C" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="480" y1="290" x2="480" y2="248" stroke="#0B658C" stroke-width="1.4"/>
  <line x1="156" y1="248" x2="156" y2="215" stroke="#0B658C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-acc-light)"/><line x1="372" y1="248" x2="372" y2="215" stroke="#0B658C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-acc-light)"/><line x1="588" y1="248" x2="588" y2="215" stroke="#0B658C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-acc-light)"/><line x1="804" y1="248" x2="804" y2="215" stroke="#0B658C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-acc-light)"/>

  <rect x="270" y="290" width="420" height="78" rx="4" fill="#F3FAFD" stroke="#8BCBE8" stroke-width="1.4"/>
  <path d="M270 298 V290 H278 M682 290 H690 V298 M270 360 V368 H278 M682 368 H690 V360" fill="none" stroke="#0B658C" stroke-width="1.6" stroke-linecap="square"/>
  <g transform="translate(412,304) scale(0.72)"><path d="M24.2 10.6 A10 10 0 1 0 26 16" fill="none" stroke="#11151B" stroke-width="2.4" stroke-linecap="square"/><path d="M25.6 6.2 V11.2 H20.6" fill="none" stroke="#11151B" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/><rect x="11" y="14.5" width="10" height="3" fill="#0B658C"/></g>
  <text x="442" y="321" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" letter-spacing="-0.3" fill="#11151B">looptender</text>
  <text x="480" y="351" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500" letter-spacing="0.8" fill="#0B658C">WATCH · WAKE · BOUND · HOLD</text>

  <text x="480" y="430" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A5564">The session stays where it lives. looptender watches it from beside the tool, on the same machine.</text>
</svg>
