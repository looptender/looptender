name: Checks

# Build and test jobs depend only on the commit, so they run for a new pull
# request, a push to it, or a reopen. They do not run on `edited`: editing a
# title or description changes no code, and re-running them there repeated
# about ten minutes of work on an unchanged commit. The one job that reads the
# title and body is in contributions.yml.
#
# `edited` also fires when a pull request's base branch is changed. That no
# longer starts these jobs by itself. Branch protection requires the branch to
# be up to date with its base, so merging the new base in pushes a commit and
# runs them; otherwise close and reopen the pull request.
#
# `merge_group` runs every job on a merge queue entry: the commit GitHub builds
# from main plus the queued pull requests, which is exactly what lands. A
# required check must report there under the same name as on the pull
# request, or the queue waits for it until it times out. Every job here keeps
# its name in the queue (it has no `base` input), and ci-scope.sh answers
# "full" for this event, so the queue never skips the macOS or Windows work.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Preview only. Decide what to run as if this ref were a pull request
          against this commit. The macOS jobs and the Build and test gates then
          report under a "Scope preview" name, so a preview can never stand in
          for a required check. Leave empty for an ordinary manual run, which runs everything.
        required: false
        default: ""

# What runs for a documentation-only change
#
# When every file a pull request changes is documentation (scripts/ci-scope.sh
# decides, and any doubt means "not documentation"), the Ubuntu job still runs
# everything, and the macOS and Windows jobs skip their work: the first steps
# decide, and every later step has a condition. The jobs themselves always run
# and keep their names, because branch protection requires "Build and test
# (macos-15)" and "Build and test (ubuntu-24.04)" by name and a job that never
# reported would block the pull request. Pushes to main, merge queue runs and
# ordinary manual runs always run everything. A change to this file or to the
# script is not documentation, so it runs everything.

permissions:
  contents: read

# A newer head supersedes an older run of this workflow. An edit to the pull
# request does not start this workflow, so it cannot cancel a run in progress.
# A merge queue run has a group of its own (its run ID), so nothing cancels it
# or makes it wait: not a push to the pull request, not another queue entry,
# and not the same pull request queued again. The queue decides when a run is
# no longer needed.
concurrency:
  group: checks-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides, in seconds, which runners this run needs; see scripts/ci-plan.py.
  # A draft pull request skips the macOS jobs, except "Other checks" when it
  # changes the Swift menu (they run when it is marked
  # ready, on later pushes and in the merge queue), and a push to main whose
  # commit already passed in the merge queue does no work. Any doubt runs
  # everything.
  plan:
    name: Plan the run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # reads the merge-queue / PR runs of the commit
      pull-requests: read # lists pull request changed files
    outputs:
      os: ${{ steps.plan.outputs.os }}
      checks_os: ${{ steps.plan.outputs.checks_os }}
      duplicate: ${{ steps.plan.outputs.duplicate }}
      scope: ${{ steps.plan.outputs.scope }}
      run_race: ${{ steps.plan.outputs.run_race }}
      run_checks: ${{ steps.plan.outputs.run_checks }}
      run_bb_plugin: ${{ steps.plan.outputs.run_bb_plugin }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      run_swift: ${{ steps.plan.outputs.run_swift }}
      run_smoke: ${{ steps.plan.outputs.run_smoke }}
      run_macos_race: ${{ steps.plan.outputs.run_macos_race }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-plan.py

  bb-plugin:
    name: BB plugin typecheck
    needs: plan
    if: needs.plan.outputs.duplicate != 'true' && needs.plan.outputs.run_bb_plugin != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/bb-plugin-keepgoing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: integrations/bb-plugin-keepgoing/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
      - name: Build CLI for plugin contract fixtures
        working-directory: .
        run: go build -o "$RUNNER_TEMP/keepgoing-plugin-test" ./cmd/looptender
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
        env:
          KEEPGOING_TEST_BINARY: ${{ runner.temp }}/keepgoing-plugin-test
      # The panel page's script is run, not only read, here: jsdom and the
      # TypeScript compiler are this package's dependencies. The Go jobs skip
      # these two tests, which need them.
      - name: Run the panel page against every loop state, and lint its helpers
        working-directory: .
        run: python3 scripts/ci-go-test-ran.py go test ./cmd/looptender -run 'TestDockPageRendersEveryLoopStateWithoutAnException|TestDockPageNeverCallsAHelperThroughAShadowingVariable' -count=1 -v
        env:
          DOCK_PAGE_REQUIRED: "1"
          DOCK_JSDOM_DIR: ${{ github.workspace }}/integrations/bb-plugin-keepgoing/node_modules/jsdom
          TS_DIR: ${{ github.workspace }}/integrations/bb-plugin-keepgoing/node_modules/typescript

  # The Windows tests run as two jobs at once. As one job they took 6 to 8.5
  # minutes on main and ran into a 10-minute limit; "The Windows jobs' time"
  # in docs/testing.md has the measurements behind the split and the limits.
  # Neither is a required check.
  windows-acl:
    # A static name: GitHub shows a skipped job's name unevaluated, so an
    # expression here would appear raw on a duplicate push. Not required.
    name: Windows access diagnostics (storage and controls)
    needs: plan
    if: needs.plan.outputs.duplicate != 'true' && needs.plan.outputs.run_windows != 'false'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read # the timeout note reads this run's steps
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PREVIEW_BASE: ${{ inputs.base }}
        # Anything but a clean "docs" answer runs everything.
        run: bash scripts/ci-scope.sh >> "$GITHUB_OUTPUT" || echo "scope=full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.scope != 'docs'
        with:
          go-version: "1.26.11"
      - run: go vet ./cmd/looptender
        if: steps.scope.outputs.scope != 'docs'
      - name: Verify registered client status and controls on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test ./cmd/looptender -run '^TestClient' -count=1
      - name: Verify local loop registry on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test ./internal/registry ./cmd/looptender -run '^TestRegistry' -count=1
      - name: Verify route list edits and their replacement while read on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test ./internal/config ./cmd/looptender -run '^TestRouteEdit' -count=1
      - name: Verify the per-user directories, their name and their move on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./internal/userdir ./internal/session ./internal/config ./internal/lock ./internal/registry ./cmd/looptender -run '^(TestMove|TestASwapThatStopped|TestOneDirectoryUnderTwoSpellings|TestRewriteMatches|TestRenameProblem|TestRegistryAddThroughAnotherSpelling|TestARecordFromBeforeARename|TestPlaceAt|TestOnePlaceMoved|TestAnInterruptedMove|TestACurrentPlace|TestLookAfterAMove|TestEveryMomentOfAMove|TestOnlyAMoveBetween|TestMigrate|TestRegistryRebase|TestNameIn|TestThisPlatform|TestDirKeepsTheEarlierDirectory|TestClaimsAndRecordsAreHonouredUnderBothNames|TestAClaimIsTakenWhenTheTwoNamesAreOneDirectory|TestLookWhenTheTwoNamesAreOneDirectory|TestHeld|TestStandardRoutesPath|TestInitDefaultDirectory|TestDoctorUserDirectory|TestRegistriesUnderBothNames)' -count=1
      - run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^(TestWindowsACL|TestDoctorACL|TestWindowsAccess|TestDoctorAccess)' -count=1
        if: steps.scope.outputs.scope != 'docs'
      - name: Verify allowance persistence and replacement on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./internal/state -run '^Test(SendLedger|ProgressLedger|LaneKey|WindowsMissingMarkedLaneKey)' -count=1
      - name: Verify runtime records can be replaced while readers poll
        # Report every record even when an earlier step has already failed.
        if: always() && (steps.scope.outputs.scope != 'docs')
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/state ./internal/health ./internal/incident ./internal/report ./internal/registry ./internal/daemoninfo ./cmd/looptender -run '^(TestStateSnapshot|Test.*SnapshotSavesWhileReadersPoll$|TestTransferRecordReads)' -count=1
      - name: Verify Sessionpipe report gates and explicit resume on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/report ./cmd/looptender -run '^(TestSessionpipe|TestReportResume)' -count=1
      - name: Verify process delivery history and notification contracts on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/report ./cmd/looptender -run '^(TestProcessDelivery|TestBBPush)' -count=1
      - name: Verify BB transfer and recovery on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^TestTransfer' -count=1
      - run: python scripts/ci-go-test-ran.py go test -v ./internal/config -run '^TestBBTransfer' -count=1
        if: steps.scope.outputs.scope != 'docs'
      - name: Verify goal-aware setup on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^TestInitGoal' -count=1
      - name: Verify Cursor guided setup on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^(TestInitCursor|TestDoctorCursor)' -count=1
      - name: Verify guided fallback setup on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^TestFallbacks(Add|Handoff|Remove|Move|Manage)' -count=1
      - name: Verify explicit assignment lifecycle and coordination records on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/control ./internal/config ./cmd/looptender -run '^Test(Assignment|DockAssignment)' -count=1
      - name: Verify private goal records on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./internal/control -run '^TestGoal' -count=1
      - name: Verify control writes across repeated and backwards clock readings
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./internal/control -run '^TestSaveAdvancesLoadedTimestamp$' -count=1
      - name: Verify daemon control polling with unchanged file metadata
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^TestDaemonWait' -count=1
      - name: Verify control snapshots permit atomic replacement on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/control ./cmd/looptender -run '^(TestControlSnapshot|TestWindowsControlSnapshot|TestDaemonWaitSnapshot)' -count=1
      - name: Verify executable record, receipt and backup metadata on Windows
        # Metadata helpers only: build replacement remains unsupported here.
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./internal/state ./cmd/looptender -run '^(TestWindowsCheckExecutable|TestWindowsBuildReceipt|TestBuildBackupPreserves)' -count=1
      - name: Verify the snapshot package on Windows
        # The whole package: every reader and writer rule of record files is
        # here, and a test that a name filter misses would never run.
        if: steps.scope.outputs.scope != 'docs'
        run: go test -race -v ./internal/snapshot -count=1
      - name: Prove the original Antigravity snapshot pair fails on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/check-antigravity-snapshot-negative.py
      - name: Verify Antigravity turn snapshot replacement on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/adapter/runner -run '^TestAntigravityTurnSnapshot' -count=1
      - name: Verify headless observation output boundaries on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/adapter/runner -run '^TestBuiltinOutputReadBoundaries$' -count=1
      - name: Verify the adapter contract cases on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: go test -race -v ./internal/adapter/conformance -count=1
      - name: Verify the run reference graph store and replacement on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: go test -race -v ./internal/rungraph -count=1
      - name: Verify selected account records and marked-missing refusal on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: go test -race -v ./internal/accounts -count=1
      - name: Verify selected account commands and effective context on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./cmd/looptender -run '^(TestAccounts|TestAccountQuota|TestPanelAccountQuota|TestPanelAccountSelection|TestPanelAccountReply|TestPanelAccountConnectClient|TestPanelSendAllowance)' -count=1
      - name: Verify bounded PR backlog evidence and ordinary wake gates on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: |
          go test -race -v ./internal/prbacklog -count=1
          python scripts/ci-go-test-ran.py go test -race -v ./internal/config ./internal/supervise ./cmd/looptender -run '^TestPRBacklog' -count=1
      - name: Verify offline run navigation on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./cmd/looptender -run '^TestRuns' -count=1
      - name: Work skipped for a documentation-only change
        if: steps.scope.outputs.scope == 'docs'
        shell: bash
        run: echo "Every changed file is documentation, so this job did no work. The Ubuntu build-and-test job ran every check." >> "$GITHUB_STEP_SUMMARY"

      - name: Say so if the job ran out of time
        if: cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT_MINUTES: "12"
        run: bash scripts/ci-timeout-note.sh

  # The tests that start and stop processes: the headless runners, the Cursor
  # command journeys and the detached start, repeated 20 times.
  windows-processes:
    name: Windows access diagnostics (processes)
    needs: plan
    if: needs.plan.outputs.duplicate != 'true' && needs.plan.outputs.run_windows != 'false'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read # the timeout note reads this run's steps
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PREVIEW_BASE: ${{ inputs.base }}
        # Anything but a clean "docs" answer runs everything.
        run: bash scripts/ci-scope.sh >> "$GITHUB_OUTPUT" || echo "scope=full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.scope != 'docs'
        with:
          go-version: "1.26.11"
      - name: Verify native headless runner lifecycle and owned cancellation
        if: steps.scope.outputs.scope != 'docs'
        run: go test -race -v ./internal/adapter/runner -count=1
      - name: Verify Cursor command recovery and active holds on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./cmd/looptender -run '^TestCursorCommand' -count=1
      - name: Verify Cursor idle holds through the real factory on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -race -v ./internal/supervise -run '^TestCursorHolds' -count=1
      - name: Verify detached background startup with a local process fixture
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^TestStartBackgroundProcess$' -count=20 -timeout=3m
      # The takeover scenarios that need no Unix-only fault hook (no kill of a
      # check, no unwritable directory, no daemon): the rest of the scenario
      # suite does not run on Windows yet. TestScenarioIncidentNoFallback
      # needed the harness to give each world an APPDATA: Windows finds the
      # user's configuration directory there, not in USERPROFILE, so without
      # it enable could not save the loop's panel reference and dock printed
      # no address (run 45051691536).
      - name: Run the takeover scenarios that need no Unix-only hook on Windows
        if: steps.scope.outputs.scope != 'docs'
        run: python scripts/ci-go-test-ran.py go test -v ./internal/scenario -run '^(TestScenarioIncidentTakeover|TestScenarioIncidentNoFallback|TestScenarioIncidentWakePolicy|TestScenarioArmedIncidentReplacesBlockedLanes|TestScenarioArmedIncidentOldLimitResets|TestScenarioTransferWithMixedChildren)$' -count=1 -timeout=8m
      - name: Work skipped for a documentation-only change
        if: steps.scope.outputs.scope == 'docs'
        shell: bash
        run: echo "Every changed file is documentation, so this job did no work. The Ubuntu build-and-test job ran every check." >> "$GITHUB_STEP_SUMMARY"

      - name: Say so if the job ran out of time
        if: cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT_MINUTES: "12"
        run: bash scripts/ci-timeout-note.sh

  # The command package's tests run as three partitions, one runner each
  # (scripts/ci-race.py, weights in scripts/ci-race-weights.json), so no runner
  # carries the whole package: on one macOS runner the two partitions and the
  # other packages together used 91 to 99 percent of the 600-second budget and
  # the merge queue run 45007959493 ran out of it with no failing test. Each
  # leg has its own 600-second budget for its command tests, then runs a share
  # of the other packages, and says which partition ran over and which tests
  # were slowest or unfinished. `checks` keeps everything else.
  race:
    name: "${{ inputs.base && 'Scope preview - ' || '' }}Race partition ${{ matrix.part }} (${{ matrix.os }})"
    needs: plan
    if: needs.plan.outputs.duplicate != 'true' && needs.plan.outputs.run_race != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        part: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # the timeout note reads this run's steps
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PREVIEW_BASE: ${{ inputs.base }}
        # Anything but a clean "docs" answer runs everything.
        run: bash scripts/ci-scope.sh >> "$GITHUB_OUTPUT" || echo "scope=full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.scope != 'docs' || matrix.os == 'ubuntu-24.04'
        with:
          go-version: "1.26.11"
      - name: Run one disjoint partition of the command package, and a share of the other packages, under the race detector
        run: python3 -u scripts/ci-race.py command ${{ matrix.part }}
        if: steps.scope.outputs.scope != 'docs' || matrix.os == 'ubuntu-24.04'
      - name: Retain this partition's inventory and logs
        if: always() && (steps.scope.outputs.scope != 'docs' || matrix.os == 'ubuntu-24.04')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: race-partition-${{ matrix.part }}-${{ matrix.os }}
          path: ${{ runner.temp }}/ci-race/
          if-no-files-found: warn
          retention-days: 7
      - name: Work skipped for a documentation-only change
        if: steps.scope.outputs.scope == 'docs' && matrix.os != 'ubuntu-24.04'
        shell: bash
        run: echo "Every changed file is documentation, so this job did no work. The Ubuntu job ran every check." >> "$GITHUB_STEP_SUMMARY"
      - name: Say so if the job ran out of time
        if: cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT_MINUTES: "15"
        run: bash scripts/ci-timeout-note.sh

  # The required checks are "Build and test (ubuntu-24.04)" and "Build and
  # test (macos-15)". They are this job, a gate that passes only when every
  # other job in this workflow passed: the race partitions, the other checks,
  # the BB plugin job and both Windows jobs. Branch protection requires only
  # these names, so any job the gate does not wait for cannot block a merge.
  # scripts/ci-workflow-test.py fails if a job of this workflow is missing from
  # `needs`. Both gates wait for all of them, so no extra required context is
  # needed. It runs on Linux for both names: it only reads results. A matrix
  # job's result covers all its legs, so a failure on either OS fails both
  # gates.
  go:
    # A name with an expression does not get the matrix value appended, so it
    # is written out.
    name: "${{ inputs.base && 'Scope preview - ' || '' }}Build and test (${{ matrix.os }})"
    strategy:
      fail-fast: false # each gate reports its own result
      matrix:
        os: [ubuntu-24.04, macos-15]
    needs: [plan, checks, race, bb-plugin, windows-acl, windows-processes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every other job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        # scripts/ci-gate.py: success from every job, skipped accepted only
        # for a run the plan marked a duplicate. Failure and cancelled never.
        run: python3 scripts/ci-gate.py

  checks:
    name: "${{ inputs.base && 'Scope preview - ' || '' }}Other checks (${{ matrix.os }})"
    needs: plan
    if: needs.plan.outputs.duplicate != 'true' && needs.plan.outputs.run_checks != 'false'
    strategy:
      fail-fast: false # a macOS failure must not cancel the Ubuntu leg and lose its results
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.checks_os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # the timeout note reads this run's steps
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this change needs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PREVIEW_BASE: ${{ inputs.base }}
        # Anything but a clean "docs" answer runs everything.
        run: bash scripts/ci-scope.sh >> "$GITHUB_OUTPUT" || echo "scope=full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.scope != 'docs' || matrix.os == 'ubuntu-24.04'
        with:
          go-version: "1.26.11"
      - name: Check the rule that decides what a change needs
        if: runner.os == 'Linux'
        run: scripts/ci-scope-test.sh
      - name: Check the rule against large files and committed executables
        if: runner.os == 'Linux'
        run: scripts/check-contributions-test.sh
      - name: Check the note for a job that ran out of time
        if: runner.os == 'Linux'
        run: scripts/ci-timeout-note-test.sh
      - name: Check workflow selection and native race execution
        if: runner.os == 'Linux'
        run: python3 scripts/ci-workflow-test.py
      - name: Check the run plan and the gate decision
        if: runner.os == 'Linux'
        run: python3 scripts/ci-plan-test.py
      - name: Check that a go test pattern matching nothing fails
        if: runner.os == 'Linux'
        run: python3 scripts/ci-go-test-ran-test.py
      - name: Check that every Windows-only test is selected by a pinned Windows step
        if: runner.os == 'Linux'
        run: |
          python3 scripts/ci-windows-inventory-test.py
          python3 scripts/ci-windows-inventory.py
      - name: Check that every macOS-only source file is covered by the macOS race suite
        if: runner.os == 'Linux'
        run: |
          python3 scripts/ci-macos-race-test.py
          python3 scripts/ci-macos-race.py --check
      - name: Check generated adapters documentation on docs-only pull requests
        if: runner.os == 'Linux' && (needs.plan.outputs.scope == 'docs' || steps.scope.outputs.scope == 'docs')
        run: python3 scripts/ci-go-test-ran.py go test ./internal/adapter/capability -run '^TestDocumentMatchesTheTable$' -count=1
      - name: Check Panel UI Go tests on dockui-only pull requests
        if: runner.os == 'Linux' && needs.plan.outputs.scope == 'dockui' && steps.scope.outputs.scope != 'docs'
        run: |
          go vet ./cmd/looptender
          python3 scripts/ci-go-test-ran.py go test -race ./cmd/looptender -run '^(TestDock|TestPanel)' -count=1
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        if: runner.os == 'Linux' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.scope != 'macos-only'
      - run: go vet ./...
        if: runner.os == 'Linux' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.scope != 'macos-only'
      - run: go build ./...
        if: (runner.os == 'macOS' && steps.scope.outputs.scope != 'docs') || (runner.os == 'Linux' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.scope != 'macos-only')
      - name: Check third-party notices match the executable's modules
        if: runner.os == 'Linux' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.scope != 'macos-only'
        run: scripts/third-party-notices.sh --check
      - name: Check race partition coverage and failure handling
        if: runner.os == 'Linux'
        run: python3 scripts/ci-race-test.py
      - name: Run macOS-specific Go packages and OS/service tests under the race detector
        if: runner.os == 'macOS' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.run_macos_race != 'false'
        run: python3 -u scripts/ci-macos-race.py
      - name: Smoke check setup and recovery with local fixtures
        if: steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.run_smoke != 'false'
        run: |
          python3 scripts/smoke-recovery-test.py
          go build -trimpath -ldflags "-X main.version=smoke-${GITHUB_SHA}" -o "$RUNNER_TEMP/keepgoing-smoke" ./cmd/looptender
          python3 scripts/smoke-release.py "$RUNNER_TEMP/keepgoing-smoke"
          python3 -u scripts/smoke-recovery.py "$RUNNER_TEMP/keepgoing-smoke" --include-cursor
      - name: Cache SwiftPM build artifacts for macOS menu
        if: runner.os == 'macOS' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.run_swift != 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: integrations/macos/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('integrations/macos/Package.swift', 'integrations/macos/Package.resolved', 'integrations/macos/Sources/**', 'integrations/macos/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-
      - name: Build and test the optional macOS menu preview
        if: runner.os == 'macOS' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.run_swift != 'false'
        run: |
          if [ ! -x "$RUNNER_TEMP/keepgoing-smoke" ]; then
            go build -trimpath -ldflags "-X main.version=smoke-${GITHUB_SHA}" -o "$RUNNER_TEMP/keepgoing-smoke" ./cmd/looptender
          fi
          swift build --package-path integrations/macos
          swift test --package-path integrations/macos
          python3 integrations/macos/scripts/smoke-contract.py "$RUNNER_TEMP/keepgoing-smoke"
      - name: Verify native Linux ACL metadata fixture
        if: runner.os == 'Linux' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.scope != 'macos-only'
        run: python3 scripts/ci-go-test-ran.py go test -v ./cmd/looptender -run '^TestLinuxACLMetadataDetectsDefaultACLHiddenByModeBits$' -count=1
      - name: Cross-compile for Windows
        if: runner.os == 'Linux' && steps.scope.outputs.scope != 'docs' && needs.plan.outputs.scope != 'docs' && needs.plan.outputs.scope != 'dockui' && needs.plan.outputs.scope != 'macos-only'
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/looptender
      - name: Work skipped for a documentation-only change
        if: steps.scope.outputs.scope == 'docs' && matrix.os != 'ubuntu-24.04'
        shell: bash
        run: echo "Every changed file is documentation, so this job did no work. The Ubuntu build-and-test job ran every check." >> "$GITHUB_STEP_SUMMARY"
      - name: Say so if the job ran out of time
        if: cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT_MINUTES: "15"
        run: bash scripts/ci-timeout-note.sh
